# SUGGESTIONS - LISTA
- model: ui.view
  ext_id: feedback_moderation_view_suggestion_list
  fields:
    name: "feedback_moderation.suggestion - Lista"
    title:
      $fallback: "Sugerencias - Lista"
    model_key: feedback_moderation.suggestion
    type_id.ext_id: ui.ui_view_type_list
    definition:
      columns:
        - { field: id, label: ID, width: 70 }
        - { field: title, label: Título, sortable: true }
        - { field: author_name, label: Autor }
        - { field: author_email, label: Email }
        - { field: status, label: Estado, chip: true }
        - { field: is_public, label: Público }
        - { field: published_at, label: Publicado el }
      filters:
        - field: status
          label: Estado
      actions:
        - { name: new, type: create, icon: mdi-plus, label: "Nueva" }
        - { name: edit, type: update, icon: mdi-pencil, label: "Editar" }
        - { name: delete, type: delete, icon: mdi-delete, label: "Eliminar" }
      row_actions:
        - key: publish
          type: service
          label: "Publicar"
          icon: mdi-check-circle
          method: publish
          model_key: feedback_moderation.suggestion
          groups: [feedback_group_moderator, core_group_superadmin]
          hidden: "item.status !== 'pending'"
          confirm:
            text: "¿Publicar esta sugerencia?"
          params:
            - name: note
              label: "Nota de moderación"
              type: string

        - key: reject
          type: service
          label: "Rechazar"
          icon: mdi-close-circle
          method: reject
          model_key: feedback_moderation.suggestion
          groups: [feedback_group_moderator, core_group_superadmin]
          hidden: "item.status !== 'pending'"
          confirm:
            text: "¿Rechazar esta sugerencia?"
          params:
            - name: note
              label: "Motivo del rechazo"
              type: string
              required: true

        - key: merge
          type: service
          label: "Fusionar"
          icon: mdi-source-merge
          method: merge
          model_key: feedback_moderation.suggestion
          groups: [feedback_group_moderator, core_group_superadmin]
          hidden: "item.status !== 'pending'"
          confirm:
            text: "¿Fusionar esta sugerencia?"
          params:
            - name: target_id
              label: "Sugerencia destino"
              type: relation
              model_key: feedback_moderation.suggestion
            - name: note
              label: "Nota de moderación"
              type: string

        - key: reopen
          type: service
          label: "Reabrir"
          icon: mdi-restore
          method: reopen
          model_key: feedback_moderation.suggestion
          groups: [feedback_group_moderator, core_group_superadmin]
          hidden: "item.status === 'pending'"
          confirm:
            text: "¿Reabrir esta sugerencia?"

# SUGGESTIONS - FORMULARIO
- model: ui.view
  ext_id: feedback_moderation_view_suggestion_form
  fields:
    name: "feedback_moderation.suggestion - Formulario"
    title:
      $fallback: "Sugerencia - Formulario"
    model_key: feedback_moderation.suggestion
    type_id.ext_id: ui.ui_view_type_form
    definition:
      groups:
        - label: Información
          fields:
            - title
            - content
            - status
            - is_public

        - label: Autor
          fields:
            - author_name
            - author_email

        - label: Clasificación
          fields:
            - tags

        - label: Moderación
          fields:
            - moderation_note
            - reviewed_by_id
            - published_at

      form_actions:
        - key: publish
          type: service
          label: "Publicar"
          icon: mdi-check-circle
          method: publish
          groups: [feedback_group_moderator, core_group_superadmin]
          confirm:
            text: "¿Publicar esta sugerencia?"
          params:
            - name: note
              label: "Nota de moderación"
              type: string

        - key: reject
          type: service
          label: "Rechazar"
          icon: mdi-close-circle
          method: reject
          groups: [feedback_group_moderator, core_group_superadmin]
          confirm:
            text: "¿Rechazar esta sugerencia?"
          params:
            - name: note
              label: "Motivo del rechazo"
              type: string
              required: true

        - key: merge
          type: service
          label: "Fusionar"
          icon: mdi-source-merge
          method: merge
          groups: [feedback_group_moderator, core_group_superadmin]
          confirm:
            text: "¿Fusionar esta sugerencia?"
          params:
            - name: target_id
              label: "Sugerencia destino"
              type: relation
              model_key: feedback_moderation.suggestion
            - name: note
              label: "Nota"
              type: string

        - key: reopen
          type: service
          label: "Reabrir"
          icon: mdi-restore
          method: reopen
          groups: [feedback_group_moderator, core_group_superadmin]
          confirm:
            text: "¿Reabrir esta sugerencia?"

